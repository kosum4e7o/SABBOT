name: Build Windows Installer

# Result: ONE file - Stream_Activity_Bot_Setup.exe (a real Inno Setup installer).
# Run it from: GitHub -> Actions -> "Build Windows Installer" -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write      # only used to attach the EXE to a GitHub Release on v* tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -c "import PySide6, websocket; from PySide6 import QtWebEngineWidgets; print('PySide6', PySide6.__version__); print('websocket-client', websocket.__version__)"

      - name: Verify repository contents
        shell: pwsh
        run: |
          $required = @("stream_activity_bot.py","version.py","kick_events.py","dash_layout.py","bet_tracker.py","ui_bets.py","stream_embed.py","ui_player.py","engine.py","app.ico","requirements.txt",
            "tests/__init__.py","tests/helpers.py","installer/StreamActivityBot.iss","installer/wizard_side.bmp","installer/wizard_side_150.bmp","installer/wizard_side_200.bmp","installer/wizard_small.bmp","installer/wizard_small_150.bmp","installer/wizard_small_200.bmp",
            "scripts/verify_onedir.ps1","scripts/smoke_test_installer.ps1")
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "Missing files/folders in the repository:"; $missing | ForEach-Object { Write-Host "  - $_" }
            throw "The repository is incomplete. Upload the WHOLE project including the folders tests, scripts, installer and .github."
          }
          Write-Host "All required project files are present."

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Syntax check failed - build stopped" }
          python -m unittest discover -s tests -t . -v
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed - build stopped" }

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from version import __version__; print(__version__)"
          Write-Host "Version: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # STEP 1 - PyInstaller ONEDIR (never onefile): the app + every runtime dependency as normal files.
      - name: Build application (PyInstaller ONEDIR)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build,dist -ErrorAction SilentlyContinue
          python -m PyInstaller `
            --noconfirm --clean --noupx `
            --onedir --windowed `
            --name Stream_Activity_Bot `
            --icon app.ico `
            --hidden-import PySide6.QtSvg `
            --hidden-import PySide6.QtWebEngineWidgets `
            --hidden-import PySide6.QtWebEngineCore `
            stream_activity_bot.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: Verify ONEDIR output
        shell: pwsh
        run: ./scripts/verify_onedir.ps1 -Dir "dist/Stream_Activity_Bot"

      # STEP 2 - Inno Setup packs the whole ONEDIR folder into ONE installer EXE.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not $iscc -and -not ($candidates | Where-Object { Test-Path $_ })) {
            choco install innosetup -y --no-progress
          }
          $found = ($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)
          if (-not $found -and $iscc) { $found = $iscc.Source }
          if (-not $found) { throw "Inno Setup (ISCC.exe) was not found after installation" }
          Write-Host "ISCC: $found"
          "ISCC_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile installer
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force installer_output -ErrorAction SilentlyContinue
          & "$env:ISCC_PATH" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=..\dist\Stream_Activity_Bot" "installer\StreamActivityBot.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Verify installer file
        shell: pwsh
        run: |
          $setup = "installer_output/Stream_Activity_Bot_Setup.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not created: $setup" }
          $mb = (Get-Item $setup).Length / 1MB
          Write-Host ("Installer size: {0:N1} MB" -f $mb)
          if ($mb -lt 12) { throw "Installer is suspiciously small ($mb MB) - build is incomplete" }
          $extra = @(Get-ChildItem installer_output -File | Where-Object { $_.Name -ne "Stream_Activity_Bot_Setup.exe" })
          if ($extra.Count -gt 0) { throw "Unexpected files next to the installer: $($extra.Name -join ', ')" }

      - name: Installer smoke test (install, verify, self-test, start, uninstall)
        shell: pwsh
        run: ./scripts/smoke_test_installer.ps1 -Installer "installer_output/Stream_Activity_Bot_Setup.exe" -InstallDir "$env:RUNNER_TEMP\SABot"

      # Only reached when EVERYTHING above passed - a broken installer is never uploaded.
      # The artifact contains exactly ONE file.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Stream_Activity_Bot_Installer
          path: installer_output/Stream_Activity_Bot_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/Stream_Activity_Bot_Setup.exe
